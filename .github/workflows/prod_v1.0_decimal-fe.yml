name: Build and deploy Node.js app to Azure Web App - decimal-fe

on:
  push:
    branches:
      - prod_v1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test --if-present

      - name: Check build output
        shell: powershell
        run: |
          Write-Host "Build output:"
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E017B723840D49468B63735EF557E5BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F9E79111AED8492F87F34CDA1EFEFD3D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26D9D149FD9E4DA199DFBC213CA501B8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'decimal-fe'
          slot-name: 'Production'
          package: .
