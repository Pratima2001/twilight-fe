name: Build and deploy Node.js app to Azure Web App - decimal-fe

on:
  push:
    branches:
      - prod_v1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare standalone files
        shell: powershell
        run: |
          Write-Host "Preparing standalone folder for Azure..."
          
          if (!(Test-Path ".next/standalone")) {
              Write-Error "Standalone folder does not exist. Make sure output: 'standalone' is set in next.config.js"
              exit 1
          }

          # Copy public folder into standalone directory
          if (Test-Path "public") {
              Copy-Item -Recurse -Force "public" ".next/standalone/public"
          }

          # Copy static files into standalone directory
          if (Test-Path ".next/static") {
              New-Item -ItemType Directory -Force -Path ".next/standalone/.next/static"
              Copy-Item -Recurse -Force ".next/static/*" ".next/standalone/.next/static/"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          find . -maxdepth 3 -type f | head -100

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E017B723840D49468B63735EF557E5BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F9E79111AED8492F87F34CDA1EFEFD3D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26D9D149FD9E4DA199DFBC213CA501B8 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'decimal-fe'
          slot-name: 'Production'
          package: .
